<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Berita Media HD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #06080d;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .ambient-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
        }
        /* Efek Kilau Tombol Otomatis */
        .btn-glow {
            position: relative;
            overflow: hidden;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: rotate(30deg);
            animation: shine 3s infinite ease-in-out;
        }
        @keyframes shine {
            0% { transform: translateX(-150%) rotate(30deg); }
            50%, 100% { transform: translateX(150%) rotate(30deg); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .float-anim {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="ambient-mesh min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Container Utama -->
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800/90 backdrop-blur-2xl rounded-[2rem] p-6 sm:p-8 shadow-[0_20px_50px_rgba(0,0,0,0.7)] flex flex-col items-center text-center relative overflow-hidden">
        
        <!-- Aksen Garis Atas Gradien -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-500"></div>

        <!-- Badge Status Server -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-bold mb-6 mt-1">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span class="tracking-wide uppercase text-[11px]">Server Streaming Siap</span>
        </div>

        <!-- Icon Play Modern Mengambang -->
        <div class="float-anim relative mb-6">
            <div class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-tr from-emerald-600 to-teal-400 rounded-3xl flex items-center justify-center text-white text-3xl sm:text-4xl shadow-xl shadow-emerald-500/30">
                <i class="fas fa-play ml-1"></i>
            </div>
            <!-- Badge Resolusi -->
            <div class="absolute -bottom-2 -right-2 bg-slate-950 border border-slate-700 text-slate-200 text-[10px] font-extrabold px-2 py-0.5 rounded-lg shadow-md">
                1080p
            </div>
        </div>

        <!-- Judul Menarik & Elegan -->
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight leading-snug mb-3">
            Tonton Video Lengkap
        </h1>

        <!-- Deskripsi -->
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-8 px-2 font-normal">
            Akses pemutar video berkecepatan tinggi dengan resolusi jernih dan bebas hambatan langsung dari perangkat Anda.
        </p>

        <!-- Tombol Aksi Utama (Sangat Menonjol & Mengundang Klik) -->
        <button id="startBtn" class="btn-glow w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-[0.97] text-slate-950 font-extrabold py-4 sm:py-5 px-6 rounded-2xl text-base sm:text-lg shadow-xl shadow-emerald-500/25 transition-all flex items-center justify-center gap-3 cursor-pointer mb-6">
            <i class="fas fa-play-circle text-xl"></i>
            <span>Buka Pemutar Video</span>
            <i class="fas fa-arrow-right text-sm"></i>
        </button>

        <!-- Fitur Spesifikasi 3 Kolom -->
        <div class="pt-5 border-t border-slate-800/80 w-full grid grid-cols-3 gap-2 text-slate-400 text-xs font-semibold">
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl hover:bg-slate-800/30 transition-colors">
                <i class="fas fa-gauge-high text-emerald-400 text-base"></i>
                <span class="text-slate-300">Fast Buffering</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl hover:bg-slate-800/30 transition-colors">
                <i class="fas fa-mobile-screen-button text-cyan-400 text-base"></i>
                <span class="text-slate-300">Semua HP</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl hover:bg-slate-800/30 transition-colors">
                <i class="fas fa-shield-check text-teal-400 text-base"></i>
                <span class="text-slate-300">Aman & Cepat</span>
            </div>
        </div>

    </div>

    <!-- Script Redirect -->
    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            setTimeout(function() {
                window.open('watch.html', '_blank');
                window.location.href = 'https://hai8g.com/4/10817249';
            }, 100);
        });
    </script>

    <!-- Tracker Histats -->
    <script type='text/javascript'>
        var _Hasync=_Hasync||[];
        _Hasync.push(['Histats.start', '1,4914312,4,0,0,0,00010000']);

            var hs = document.createElement('script'); hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';
            (document.head||document.body).appendChild(hs);
        })();
    </script>
</body>
</html>
